name: Build & Release MesAI (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release (Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Verify .NET Installation
        run: dotnet --info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Test Suite
        run: npm test

      - name: Build Tauri Application & NSIS Installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $ver = $pkg.version
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $setupExe = Get-ChildItem "$nsisDir/*-setup.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "$nsisDir/MesAI-Setup-$ver.exe" -Force
          }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item "$nsisDir/MesAI-Setup-$ver.exe" release-artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "$nsisDir/*.sig" release-artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/target/release/bundle/nsis/latest.json" release-artifacts/ -ErrorAction SilentlyContinue

      - name: Publish Production Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
