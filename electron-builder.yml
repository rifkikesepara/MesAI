appId: com.mesai.devtrack
productName: MesAI
directories:
  output: dist-electron
files:
  - dist-main/**/*
  - dist-renderer/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: readers/ZoomChatReader/bin/Release/net10.0-windows
    to: ZoomChatReader
    filter:
      - "**/*"
publish:
  provider: github
  owner: rifkikesepara
  repo: MesAI
  releaseType: release
win:
  icon: assets/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  artifactName: "MesAI-Setup-${version}.exe"
portable:
  artifactName: "MesAI-${version}-Portable.exe"

